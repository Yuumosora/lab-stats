<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лаборатория: статистика месяца</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <header class="bg-success text-white py-3 mb-4">
    <div class="container" style="max-width: 900px">
      <h1 class="h4 m-0">Лаборатория: статистика месяца</h1>
    </div>
  </header>

  <main class="container pb-5" style="max-width: 900px">

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h2 class="h5">Новый заказ</h2>
        <form id="orderForm" class="row g-3">
          <div class="col-sm-6">
            <label class="form-label" for="name">Клиент (имя)</label>
            <input class="form-control" id="name" autocomplete="off">
          </div>
          <div class="col-6 col-sm-3">
            <label class="form-label" for="age">Возраст</label>
            <input class="form-control" id="age" type="number" min="0" max="120">
          </div>
          <div class="col-6 col-sm-3">
            <label class="form-label d-block">Пол</label>
            <div class="btn-group" role="group" aria-label="Пол">
              <input type="radio" class="btn-check" name="sex" id="sexM" value="male" checked>
              <label class="btn btn-outline-secondary" for="sexM">Муж</label>
              <input type="radio" class="btn-check" name="sex" id="sexF" value="female">
              <label class="btn btn-outline-secondary" for="sexF">Жен</label>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">Исследования (выбрано: <span id="selCount">0</span>)</label>
            <div id="tests" class="d-flex flex-wrap gap-2"></div>
          </div>
          <div class="col-12">
            <div id="msg" class="alert alert-danger py-2 d-none" role="alert"></div>
            <button type="submit" class="btn btn-success w-100">Добавить заказ</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h5 m-0">Заказы за месяц (<span id="count">0</span>)</h2>
          <button id="demo" type="button" class="btn btn-outline-secondary btn-sm">Демо-данные</button>
        </div>
        <ul id="orders" class="list-group list-group-flush">
          <li class="list-group-item text-muted">Пока нет заказов. Добавьте первый.</li>
        </ul>
      </div>
    </div>

    <button id="calc" type="button" class="btn btn-primary w-100 mb-3" disabled>Рассчитать</button>

    <section id="results" class="d-none"></section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="tests.js"></script>
  <script src="stats.js"></script>
  <script src="app.js"></script>
</body>
</html>
